default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: scorey-format-check
        name: scorey format check
        entry: make format-check
        language: system
        pass_filenames: false
        stages: [pre-commit, manual]

      - id: scorey-lint
        name: scorey lint
        entry: make lint
        language: system
        pass_filenames: false
        stages: [pre-commit, manual]

      - id: scorey-typecheck
        name: scorey typecheck
        entry: make typecheck
        language: system
        pass_filenames: false
        stages: [pre-push, manual]

      - id: scorey-test-cov
        name: scorey test coverage
        entry: make test-cov
        language: system
        pass_filenames: false
        stages: [pre-push, manual]
