[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "scorey"
version = "0.1.0"
description = "Rigged local CLI rock-paper-scissors mini chatbot within the Polinko research line."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "idna==3.20",
  "openai==3.15.0",
  "openai-agents==0.22.3",
  "PyJWT==2.14.0",
  "python-dotenv==1.2.3",
  "starlette==1.6.0",
  "urllib3==2.8.0",
]

[project.optional-dependencies]
dev = [
  "build==1.6.1",
  "mypy==2.3.1",
  "pip-audit==2.10.1",
  "pre-commit==4.6.2",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.8",
]

[project.scripts]
scorey = "scorey.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scorey = ["data/*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["scorey"]

[tool.coverage.report]
show_missing = true
skip_covered = false
skip_empty = true

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests", "scripts"]
pretty = true
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["agents", "dotenv"]
ignore_missing_imports = true

# OpenAI's optional NumPy proxy can expose notebook-installed stubs that use
# Python 3.12 syntax. Scorey does not use NumPy; keep our Python 3.10 checks.
[[tool.mypy.overrides]]
module = ["numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
