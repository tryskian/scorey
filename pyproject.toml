[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "scorey"
version = "0.1.0"
description = "Rigged local CLI rock-paper-scissors mini chatbot within the Polinko research line."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai-agents==0.14.7",
  "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = [
  "build==1.5.0",
  "mypy==1.20.2",
  "pre-commit==4.5.1",
  "pytest==9.0.3",
  "pytest-cov==7.1.0",
  "ruff==0.15.12",
]

[project.scripts]
scorey = "scorey.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["scorey"]

[tool.coverage.report]
show_missing = true
skip_covered = false
skip_empty = true

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests", "scripts"]
pretty = true
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["agents", "dotenv"]
ignore_missing_imports = true
